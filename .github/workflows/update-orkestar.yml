name: Update orkestar

on:
  schedule:
    - cron: "42 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-orkestar

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove unrelated runner tap
        shell: bash
        run: brew untap aws/tap || true
      - uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869
        with:
          core: false
          cask: false
          token: ${{ github.token }}
      - name: Read latest release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag=$(curl --fail --silent --show-error \
            https://api.github.com/repos/martintrifunov/orkestar/releases/latest | \
            ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("tag_name")')
          version="${tag#v}"
          url="https://github.com/martintrifunov/orkestar/archive/refs/tags/${tag}.tar.gz"
          sha=$(curl --fail --location --silent --show-error "$url" | shasum -a 256 | cut -d' ' -f1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Update formula
        shell: bash
        env:
          URL: ${{ steps.release.outputs.url }}
          SHA: ${{ steps.release.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          ruby -e '
            path = "Formula/orkestar.rb"
            formula = File.read(path)
            formula.sub!(/^  url ".*"$/, "  url \"#{ENV.fetch("URL")}\"")
            formula.sub!(/^  sha256 ".*"$/, "  sha256 \"#{ENV.fetch("SHA")}\"")
            File.write(path, formula)
          '
          if git diff --quiet -- Formula/orkestar.rb; then
            echo "Formula already targets ${VERSION}."
            exit 0
          fi
          brew audit --strict martintrifunov/tap/orkestar
          brew install --build-from-source martintrifunov/tap/orkestar
          brew test martintrifunov/tap/orkestar
      - name: Commit update
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git diff --quiet -- Formula/orkestar.rb; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/orkestar.rb
          git commit -m "update orkestar to ${VERSION}"
          git push
